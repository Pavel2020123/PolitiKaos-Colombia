<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b16">
  <title>PolitiKaos Colombia</title>
  <style>
    :root { color-scheme: dark; font-family: "Trebuchet MS", Arial, sans-serif; background: #0d0e15; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #0d0e15;
      overflow: hidden;
    }
    #game-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      max-width: 1280px;
      max-height: 720px;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(0, 0, 0, .72), 0 0 26px rgba(255, 211, 63, .08);
    }
    #game-container canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <main id="game-container" aria-label="Videojuego PolitiKaos Colombia"></main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
